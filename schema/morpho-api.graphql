"""
Morpho Blue market
"""
type Market implements ChainReference {
  """
  Market bad debt values
  """
  badDebt: MarketBadDebt
  """
  The chain on which the entity is deployed.
  """
  chain: Chain!
  collateralAsset: Asset
  """
  Underlying amount of assets that can be reallocated to this market
  """
  collateralPrice: BigInt @deprecated(reason: "Use state.price instead.")
  """
  Block number at which the market was created
  """
  creationBlockNumber: Int!
  """
  Timestamp at which the market was created
  """
  creationTimestamp: BigInt!
  creatorAddress: Address @deprecated(reason: "Deprecated.")
  """
  Current IRM curve at different utilization thresholds for display purpose
  """
  currentIrmCurve(numberOfPoints: Int = 100): [IRMCurveDataPoint!]
  dailyApys: MarketApyAggregates @deprecated(reason: "Use market.state daily average APYs instead.")
  """
  State history
  """
  historicalState: MarketHistory
  """
  IRM contract address
  """
  irmAddress: Address!
  listed: Boolean!
  """
  Liquidation LTV
  """
  lltv: BigInt!
  loanAsset: Asset!
  """
  On-chain market ID
  """
  marketId: MarketId!
  monthlyApys: MarketApyAggregates @deprecated(reason: "Use market.state monthly average APYs instead.")
  morphoBlue: MorphoBlue!
  oracle: Oracle
  oracleAddress: Address! @deprecated(reason: "Use oracle.address instead.")
  oracleInfo: MarketOracleInfo @deprecated(reason: "Use oracle entity instead.")
  """
  Pre-liquidation contracts deployed for this market with known default parameters
  """
  preLiquidations(
    """
    Number of items requested
    """
    first: Int = 100
    """
    Number of items skipped. Maximum 10000.
    """
    skip: Int = 0
  ): PaginatedPreLiquidations!
  """
  Public allocator shared liquidity available reallocations
  """
  publicAllocatorSharedLiquidity: [PublicAllocatorSharedLiquidity!]
  """
  Market realized bad debt values
  """
  realizedBadDebt: MarketBadDebt
  reallocatableLiquidityAssets: BigInt!
  """
  Current state
  """
  state: MarketState
  """
  Whitelisted vaults having the market enabled or still allocated.
  """
  supplyingVaultV2s: [VaultV2!]!
  """
  Whitelisted vaults having the market enabled with a non-zero cap.
  """
  supplyingVaults: [Vault!]!
  targetBorrowUtilization: BigInt! @deprecated(reason: "Deprecated. This field always returns 90%.")
  targetWithdrawUtilization: BigInt! @deprecated(reason: "Deprecated. This field always returns 90%.")
