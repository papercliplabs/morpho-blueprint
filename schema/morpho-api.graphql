type VaultV2Timelock {
  """
  The timestamp the function was abdicated at, null if not abdicated
  """
  abdicatedAt: BigInt
  """
  Last updated at block number
  """
  blockNumber: BigInt!
  """
  Duration of the timelock
  """
  duration: BigInt!
  """
  Targeted function
  """
  functionName: String!
  """
  Targeted selector
  """
  selector: HexString!
  """
  Last updated at timestamp
  """
  timestamp: BigInt!
}

type VaultV2TimelockPendingData {
  """
  Function name
  """
  functionName: String!
  """
  Function selector
  """
  selector: HexString!
  """
  Pending timelock duration
  """
  timelock: BigInt!
}

enum VaultV2TimelockedFunctionName {
  Abdicate
  AddAdapter
  DecreaseTimelock
  IncreaseAbsoluteCap
  IncreaseRelativeCap
  IncreaseTimelock
  RemoveAdapter
  SetAdapterRegistry
  SetForceDeallocatePenalty
  SetIsAllocator
  SetManagementFee
  SetManagementFeeRecipient
  SetPerformanceFee
  SetPerformanceFeeRecipient
  SetReceiveAssetsGate
  SetReceiveSharesGate
  SetSendAssetsGate
  SetSendSharesGate
}

"""
Vault V2 transaction
"""
type VaultV2Transaction implements ChainReference {
  """
  Underlying assets amount. For transfers this is an approximation derived from the hour bucket share price or the latest current-hour state, and may be null when no valuation state is available.
  """
  assets: BigInt
  blockNumber: BigInt!
  """
  The chain on which the entity is deployed.
  """
  chain: Chain!
  data: VaultV2TransactionData!
  logIndex: Int!
  shares: BigInt!
  timestamp: BigInt!
  txHash: HexString!
  txIndex: Int!
  type: VaultV2TransactionType!
  vault: VaultV2!
}

"""
Cursor anchor for Vault V2 transactions.
"""
input VaultV2TransactionCursorInput {
  """
  Log index of the cursor anchor.
  """
  logIndex: Int!
  """
  Transaction hash of the cursor anchor.
  """
  txHash: HexString!
}

union VaultV2TransactionData = VaultV2DepositData | VaultV2TransferData | VaultV2WithdrawData

"""
Filtering options for transactions. AND operator is used for multiple filters, while OR operator is used for multiple values in the same filter.
"""
input VaultV2TransactionFilters {
  """
  Filter by greater than or equal to given amount of market assets, in underlying token units
  """
  assets_gte: BigInt
  """
  Filter by lower than or equal to given amount of market assets, in underlying token units
  """
  assets_lte: BigInt
  """
  Filter by chain id
  """
  chainId_in: [Int!]
  """
  Cursor anchor for exact Vault V2 transaction pagination.
  """
  cursor: VaultV2TransactionCursorInput
  """
  Filter by transaction hash
  """
  hash: String
  """
  Filter by greater than or equal to given amount of MetaMorpho vault shares
  """
  shares_gte: BigInt
  """
  Filter by lower than or equal to given amount of MetaMorpho vault shares
  """
  shares_lte: BigInt
  """
  Filter by greater than or equal to given timestamp
  """
  timestamp_gte: Int
  """
  Filter by lower than or equal to given timestamp
  """
  timestamp_lte: Int
  """
  Filter by transaction type
  """
  type_in: [VaultV2TransactionType!]
  """
  Filter by user address. Case insensitive.
  """
  userAddress_in: [String!]
  """
  Filter by MetaMorpho vault address
  """
  vaultAddress_in: [String!]
}

enum VaultV2TransactionOrderBy {
  Shares
  Time
}

enum VaultV2TransactionType {
  Deposit
  Transfer
  Withdraw
}

"""
Vault V2 transfer data
"""
type VaultV2TransferData {
  from: String!
  to: String!
}

"""
Type of VaultV2
"""
enum VaultV2Type {
  FeeWrapper
  MorphoVault
}

type VaultV2VaultAdapterReference {
  address: Address!
  targetAddress: Address!
}

type VaultV2Warning {
  level: VaultV2WarningLevel!
  metadata: VaultV2WarningMetadata
  type: String!
}

"""
Warning level for Vault V2 warnings. GREEN indicates passing checks, YELLOW indicates caution, RED indicates danger.
"""
enum VaultV2WarningLevel {
  GREEN
  RED
  YELLOW
}

union VaultV2WarningMetadata =
  | CustomMetadata
  | MultipleMarketV1AdaptersVaultV2WarningMetadata
  | MultipleVaultAdaptersVaultV2WarningMetadata
  | NotWhitelistedVaultV2WarningMetadata
  | TimelockVaultV2WarningMetadata
  | UnrecognizedAssetVaultWarningMetadata

"""
Filtering options for vault V2 warnings. AND operator is used for multiple filters, while OR operator is used for multiple values in the same filter.
"""
input VaultV2WarningsFilters {
  """
  Filter by warning level
  """
  level_in: [VaultV2WarningLevel!]
  """
  Filter by warning type
  """
  type_in: [String!]
}

"""
Vault V2 withdraw data
"""
type VaultV2WithdrawData {
  assets: BigInt!
  onBehalf: String!
  receiver: String!
  sender: String!
}

input VaultV2sFilters {
  """
  Filter by vault v2 address
  """
  address_in: [String!]
  """
  Filter by greater than or equal to given APY.
  """
  apy_gte: Float
  """
  Filter by lower than or equal to given APY.
  """
  apy_lte: Float
  """
  Filter by underlying asset address
  """
  assetAddress_in: [Address!]
  """
  Filter by chain id
  """
  chainId_in: [Int!]
  """
  Filter by creation timestamp >= value (seconds)
  """
  creationTimestamp_gte: BigInt
  """
  Filter by creation timestamp <= value (seconds)
  """
  creationTimestamp_lte: BigInt
  """
  Filter by curator address
  """
  curatorAddress_in: [Address!]
  """
  Filter by greater than or equal to given amount of idle assets, in USD.
  """
  idleAssetsUsd_gte: Float
  """
  Filter by lower than or equal to given amount of idle assets, in USD.
  """
  idleAssetsUsd_lte: Float
  """
  Filter by greater than or equal to given amount of idle assets, in underlying token units.
  """
  idleAssets_gte: BigInt
  """
  Filter by lower than or equal to given amount of idle assets, in underlying token units.
  """
  idleAssets_lte: BigInt
  """
  Filter by greater than or equal to given amount of liquidity, in USD.
  """
  liquidityUsd_gte: Float
  """
  Filter by lower than or equal to given amount of liquidity, in USD.
  """
  liquidityUsd_lte: Float
  """
  Filter by greater than or equal to given amount of liquidity, in underlying token units.
  """
  liquidity_gte: BigInt
  """
  Filter by lower than or equal to given amount of liquidity, in underlying token units.
  """
  liquidity_lte: BigInt
  listed: Boolean
  """
  Filter by management fee abdication
  """
  managementFeeAbdicated: Boolean
  """
  Filter by management fee >= value (rate per second, WAD-scaled)
  """
  managementFee_gte: BigInt
  """
  Filter by management fee <= value (rate per second, WAD-scaled)
  """
  managementFee_lte: BigInt
  """
  Filter by max rate >= value (rate per second)
  """
  maxRate_gte: BigInt
  """
  Filter by max rate <= value (rate per second)
  """
  maxRate_lte: BigInt
  """
  Filter by greater than or equal to given net APY.
  """
  netApy_gte: Float
  """
  Filter by lower than or equal to given net APY.
  """
  netApy_lte: Float
  """
  Filter by vault owner address
  """
  ownerAddress_in: [Address!]
  """
  Filter by performance fee abdication
  """
  performanceFeeAbdicated: Boolean
  """
  Filter by performance fee >= value (WAD-scaled)
  """
  performanceFee_gte: BigInt
  """
  Filter by performance fee <= value (WAD-scaled)
  """
  performanceFee_lte: BigInt
  """
  Filter by greater than or equal to given amount of real assets, in USD.
  """
  realAssetsUsd_gte: Float
  """
  Filter by lower than or equal to given amount of real assets, in USD.
  """
  realAssetsUsd_lte: Float
  """
  Filter by greater than or equal to given amount of real assets, in underlying token units.
  """
  realAssets_gte: BigInt
  """
  Filter by lower than or equal to given amount of real assets, in underlying token units.
  """
  realAssets_lte: BigInt
  """
  Filter by greater than or equal to given amount of total assets, in USD.
  """
  totalAssetsUsd_gte: Float
  """
  Filter by lower than or equal to given amount of total assets, in USD.
  """
  totalAssetsUsd_lte: Float
  """
  Filter by greater than or equal to given amount of total assets, in underlying token units.
  """
  totalAssets_gte: BigInt
  """
  Filter by lower than or equal to given amount of total assets, in underlying token units.
  """
  totalAssets_lte: BigInt
  """
  Filter by greater than or equal to given amount of total supply.
  """
  totalSupply_gte: BigInt
  """
  Filter by lower than or equal to given amount of total supply.
  """
  totalSupply_lte: BigInt
  """
  Filter by vault type
  """
  type_in: [VaultV2Type!]
}

type VaultWarning {
  level: WarningLevel!
  metadata: VaultWarningMetadata
  type: String!
}

union VaultWarningMetadata =
  | CustomMetadata
  | InvalidNameVaultWarningMetadata
  | InvalidSymbolVaultWarningMetadata
  | NotWhitelistedVaultWarningMetadata
  | ShortTimelockVaultWarningMetadata
  | UnrecognizedDepositAssetVaultWarningMetadata

enum WarningLevel {
  RED
  YELLOW
}
